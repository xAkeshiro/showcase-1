<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <!-- Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer square -->
    <rect x="5" y="5" width="70" height="70" fill="none" stroke="#000000" stroke-width="1" opacity="0.25"/>

    <!-- Middle square - rotated 45deg -->
    <rect x="17.5" y="17.5" width="45" height="45" fill="none" stroke="#000000" stroke-width="1" opacity="0.3" transform="rotate(45 40 40)"/>

    <!-- Inner square - rotated 15deg -->
    <rect x="22.5" y="22.5" width="35" height="35" fill="none" stroke="#000000" stroke-width="0.75" opacity="0.2" transform="rotate(15 40 40)"/>

    <!-- Star center -->
    <text x="40" y="48" font-size="22" fill="#000000" text-anchor="middle" font-family="Arial, sans-serif">&#9733;</text>
  </g>

  <!-- KUROSEI text -->
  <text x="110" y="58" font-size="32" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-weight="600" letter-spacing="8">KUROSEI</text>

  <!-- Japanese subtitle -->
  <text x="110" y="78" font-size="10" fill="#666666" font-family="Arial, sans-serif" letter-spacing="2">黒星スタジオ</text>
</svg>
